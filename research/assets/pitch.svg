<text x="80" y="460" font-family="Sora,system-ui,sans-serif" font-size="40" font-weight="600" fill="#e8ebf2">Collectors. Content creators. Flippers.</text>
<text x="80" y="522" font-family="Sora,system-ui,sans-serif" font-size="29" font-weight="300" fill="#8a93a6">Plan a binder before you buy it. Turn cards into posts</text>
<text x="80" y="566" font-family="Sora,system-ui,sans-serif" font-size="29" font-weight="300" fill="#8a93a6">worth reading. See what a page is actually worth.</text>

<g font-family="Sora,system-ui,sans-serif">
  <text x="80" y="680" font-size="26" font-weight="600" fill="#36d399">→</text><text x="126" y="680" font-size="26" font-weight="300" fill="#e8ebf2">Binder pages, priced before you spend</text>
  <text x="80" y="742" font-size="26" font-weight="600" fill="#36d399">→</text><text x="126" y="742" font-size="26" font-weight="300" fill="#e8ebf2">Post-ready images, artist always credited</text>
  <text x="80" y="804" font-size="26" font-weight="600" fill="#36d399">→</text><text x="126" y="804" font-size="26" font-weight="300" fill="#e8ebf2">Daily streaks that keep your run yours</text>
  <text x="80" y="866" font-size="26" font-weight="600" fill="#36d399">→</text><text x="126" y="866" font-size="26" font-weight="300" fill="#e8ebf2">Want lists and trade lists, totalled</text>
  <text x="80" y="928" font-size="26" font-weight="600" fill="#5a6273">?</text><text x="126" y="928" font-size="26" font-weight="300" fill="#8a93a6">Something physical. Not everyone gets the same one.</text>
</g>

<line x1="80" y1="1010" x2="1120" y2="1010" stroke="#20252f" stroke-width="1"/>

