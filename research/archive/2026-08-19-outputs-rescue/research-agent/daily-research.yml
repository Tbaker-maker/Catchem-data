# .github/workflows/daily-research.yml
# Daily Pokemon TCG research agent — closes the "3-month blindspot" failure mode.
# Runs after the price bot (~04:51 UTC). Needs repo secret: ANTHROPIC_API_KEY.
name: daily-research
on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily (~6am PT)
  workflow_dispatch: {}     # manual "Run workflow" button for testing
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Run research agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/daily-research.mjs
      - name: Commit findings
        run: |
          git config user.name "catchem-research-bot"
          git config user.email "bot@catchemtcg.com"
          git add research/ data/release-radar.json
          git diff --cached --quiet || git commit -m "research: daily digest $(date -u +%F)"
          git push
