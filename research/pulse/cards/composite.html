<!doctype html><meta charset="utf-8">
<title>Which row wins?</title>
<style>
  body{margin:0;background:#070910;display:flex;align-items:center;justify-content:center;min-height:100vh;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:40px 20px}
  .wrap{max-width:934px;width:100%}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;justify-content:center;align-items:start}
  .card{text-align:center}
  .card img{width:100%;aspect-ratio:745/1040;object-fit:contain;display:block;border-radius:12px}
  .cap{color:#8a93a8;font-size:16px;margin-top:14px}
  .label{color:#f4f5f8;font-weight:800;font-size:30px;text-align:center;margin:34px 0 0}
  .foot{display:flex;justify-content:space-between;margin-top:28px;align-items:baseline}
  .mark{color:#36d399;font-weight:800;font-size:22px}
  .src{color:#5c637a;font-size:14px;font-family:ui-monospace,monospace}
  @media(max-width:700px){.row{gap:14px}.cap{font-size:13px}.label{font-size:22px}}
</style>
<div class="wrap">
  <div class="row">
    <div class="card"><img src="https://images.pokemontcg.io/base3/2_hires.png" alt="Articuno" loading="eager">
      <div class="cap">Articuno · 1999</div></div>
    <div class="card"><img src="https://images.pokemontcg.io/base3/15_hires.png" alt="Zapdos" loading="eager">
      <div class="cap">Zapdos · 1999</div></div>
    <div class="card"><img src="https://images.pokemontcg.io/base3/12_hires.png" alt="Moltres" loading="eager">
      <div class="cap">Moltres · 1999</div></div>
    <div class="card"><img src="https://images.pokemontcg.io/bw4/27_hires.png" alt="Articuno" loading="eager">
      <div class="cap">Articuno · 2012</div></div>
    <div class="card"><img src="https://images.pokemontcg.io/bw4/41_hires.png" alt="Zapdos" loading="eager">
      <div class="cap">Zapdos · 2012</div></div>
    <div class="card"><img src="https://images.pokemontcg.io/bw4/14_hires.png" alt="Moltres" loading="eager">
      <div class="cap">Moltres · 2012</div></div>
    <div class="card"><img src="https://images.pokemontcg.io/swsh12/36_hires.png" alt="Articuno" loading="eager">
      <div class="cap">Articuno · 2022</div></div>
    <div class="card"><img src="https://images.pokemontcg.io/pgo/29_hires.png" alt="Zapdos" loading="eager">
      <div class="cap">Zapdos · 2022</div></div>
    <div class="card"><img src="https://images.pokemontcg.io/pgo/12_hires.png" alt="Moltres" loading="eager">
      <div class="cap">Moltres · 2022</div></div>
  </div>
  <div class="label">Which row wins?</div>
  <div class="foot"><span class="mark">Catch'em</span><span class="src">Which row wins?</span></div>
  <div style="text-align:center;margin-top:26px">
    <button id="dl" style="background:#36d399;color:#070910;border:0;border-radius:10px;padding:14px 28px;font-size:16px;font-weight:700;cursor:pointer">Download as one image</button>
    <div id="msg" style="color:#8a93a8;font-size:13px;margin-top:10px"></div>
  </div>
</div>
<script>
// The browser composites, because it can reach the image host and chat cannot.
// Everything is drawn at native card resolution so the result is postable
// rather than a screenshot of a screenshot.
const CARDS = [{"url":"https://images.pokemontcg.io/base3/2_hires.png","name":"Articuno","year":"1999"},{"url":"https://images.pokemontcg.io/base3/15_hires.png","name":"Zapdos","year":"1999"},{"url":"https://images.pokemontcg.io/base3/12_hires.png","name":"Moltres","year":"1999"},{"url":"https://images.pokemontcg.io/bw4/27_hires.png","name":"Articuno","year":"2012"},{"url":"https://images.pokemontcg.io/bw4/41_hires.png","name":"Zapdos","year":"2012"},{"url":"https://images.pokemontcg.io/bw4/14_hires.png","name":"Moltres","year":"2012"},{"url":"https://images.pokemontcg.io/swsh12/36_hires.png","name":"Articuno","year":"2022"},{"url":"https://images.pokemontcg.io/pgo/29_hires.png","name":"Zapdos","year":"2022"},{"url":"https://images.pokemontcg.io/pgo/12_hires.png","name":"Moltres","year":"2022"}];
const LABEL = "Which row wins?";
const CAPTION = "Which row wins?";
document.getElementById("dl").onclick = async () => {
  const msg = document.getElementById("msg");
  msg.textContent = "composing…";
  const CW = 745, CH = 1040, GAP = 60, PAD = 90, CAPH = 130, LABH = LABEL ? 110 : 0;
  const W = PAD * 2 + CW * CARDS.length + GAP * (CARDS.length - 1);
  const H = PAD + CH + CAPH + LABH + 90;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  g.fillStyle = "#070910"; g.fillRect(0, 0, W, H);
  try {
    for (let i = 0; i < CARDS.length; i++) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = CARDS[i].url; });
      const x = PAD + i * (CW + GAP);
      g.drawImage(img, x, PAD, CW, CH);
      g.fillStyle = "#8a93a8"; g.font = "28px system-ui, sans-serif"; g.textAlign = "center";
      g.fillText(CARDS[i].name + " · " + CARDS[i].year, x + CW / 2, PAD + CH + 52);
    }
    if (LABEL) { g.fillStyle = "#f4f5f8"; g.font = "800 52px system-ui, sans-serif"; g.textAlign = "center";
      g.fillText(LABEL, W / 2, PAD + CH + CAPH + 40); }
    g.fillStyle = "#36d399"; g.font = "800 38px system-ui, sans-serif"; g.textAlign = "left";
    g.fillText("Catch'em", PAD, H - 34);
    g.fillStyle = "#5c637a"; g.font = "24px ui-monospace, monospace"; g.textAlign = "right";
    g.fillText(CAPTION, W - PAD, H - 34);
    // Tainted canvas throws here rather than returning something broken.
    const url = cv.toDataURL("image/png");
    const a = document.createElement("a");
    a.href = url; a.download = "catchem-" + CAPTION.replace(/[^a-z0-9]+/gi, "-").toLowerCase() + ".png";
    a.click();
    msg.textContent = "downloaded — one image, ready to post";
  } catch (e) {
    msg.textContent = "the image host will not allow a cross-origin copy, so the canvas cannot be exported. Screenshot the row above instead.";
  }
};
</script>
