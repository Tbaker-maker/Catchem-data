name: History import (manual, one-off)

# Manual only. Applies the reviewed code patch in ops/history-import.patch,
# imports the 2026-09-25 history backfill into labelled per-product files,
# rebuilds Heat Check and the indexes, runs the tests, and pushes the result
# to a branch for a pull request. It never pushes to main.
on:
  workflow_dispatch:
    inputs:
      ppt_run_id:
        description: "Actions run id that holds the ppt-history-raw artifact"
        default: "36206031966"

permissions:
  contents: write
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply the code patch
        run: |
          git apply --whitespace=nowarn ops/history-import.patch
          git rm -q ops/history-import.patch
      - name: Download PPT raw responses
        uses: actions/download-artifact@v4
        with:
          name: ppt-history-raw
          path: ppt-history-raw
          run-id: ${{ inputs.ppt_run_id }}
          github-token: ${{ github.token }}
      - name: Import history (PPT sealed + rarebox singles)
        env:
          PPT_RAW_DIR: ppt-history-raw
        run: node scripts/import-history-backfill.mjs
      - name: Card image map (source-published URLs)
        run: node scripts/build-card-images.mjs
      - name: Tests
        run: |
          node scripts/tests/index-baskets.test.mjs
          node scripts/tests/heat-check.test.mjs
          node scripts/tests/run-tests.mjs
      - name: Heat Check and indexes
        run: |
          node scripts/compute-heat-check.mjs
          node scripts/compute-indexes.mjs
      - name: Push branch
        run: |
          git config user.name "catchem-bot"
          git config user.email "bot@catchem.app"
          git checkout -b ops/history-import-${{ github.run_id }}
          git add -A scripts AGENTS-AND-LOGIC.md SYSTEM-README.md data/heat-check-methodology.md \
            data/history/ppt-sealed data/history/singles-rarebox data/card-images.json \
            data/heat-check.json data/indexes
          git commit -q -m "history: PPT sealed + rarebox singles backfill, readers, pulse fixes (run ${{ github.run_id }})"
          git push -q origin HEAD
          echo "pushed ops/history-import-${{ github.run_id }}"
