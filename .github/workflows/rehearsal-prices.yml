# DRESS REHEARSAL of update-sealed-prices.yml, generated from it at main.
# No eBay, no PPT fetch, no Discord, no issues, no mirror, no app rebuild trigger.
# Every git push is blocked (persist-credentials false + pushInsteadOf to a dead host).
# The publish step builds the same orphan commit and runs the same guard + smoke,
# against the live public-data tip, and pushes nothing. Every step continues on
# error so one run lists every failure. Triggered by pushes to ci/rehearsal2 only.
name: 'Rehearsal: update sealed prices (no eBay, no push)'
on:
  push:
    branches:
    - ci/rehearsal2
  workflow_dispatch:
concurrency:
  group: rehearsal-prices-2
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  full:
    name: full (every step in order)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        filter: blob:none
        persist-credentials: false
    - name: Rehearsal setup (block every push, start memory monitor)
      run: bash .github/rehearsal/setup.sh
    - name: Setup Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install dependencies (resvg — cards rasterize to PNG in CI)
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        npm install --no-audit --no-fund
        REH_EOF
        bash .github/rehearsal/r.sh "Install dependencies (resvg — cards rasterize to PNG in CI)" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Write today's TCGCSV catalog day
      id: tcgcsv-day
      continue-on-error: true
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/fetch-tcgcsv-catalog.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Write today's TCGCSV catalog day" /tmp/reh/cur.sh
    - name: Commit today's TCGCSV day
      if: always()
      continue-on-error: true
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        git config user.name "catchem-bot"
        git config user.email "bot@catchem.app"
        if ! git add data/history/tcgcsv-daily/ data/catalog/tcgcsv-latest.json data/catalog/tcgcsv-coverage.json; then
          echo "::warning::Could not stage the TCGCSV day and catalog; the price commit below stages them again."
        fi
        if git diff --staged --quiet; then
          echo "No new TCGCSV day or catalog."
        else
          git commit -m "data: tcgcsv day $(date -u +'%Y-%m-%d')"
          pushed=0
          for i in 1 2 3; do
            if echo "[rehearsal] push skipped"; then pushed=1; break; fi
            echo "push rejected (attempt $i). Rebasing onto moved main."
            git pull --rebase --autostash origin main || RT node scripts/resolve-listing-counts-conflict.mjs || true
          done
          if [ "$pushed" != "1" ]; then
            echo "::warning::TCGCSV day was committed locally but not pushed after 3 tries. The price commit push below carries it."
          fi
        fi
        REH_EOF
        bash .github/rehearsal/r.sh "Commit today's TCGCSV day" /tmp/reh/cur.sh
    - name: Preflight patch guard-audit (deep script lookback + registered env bridge)
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/patch-guard-audit-ci.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Preflight patch guard-audit (deep script lookback + registered env bridge)" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Guard audit (fails the run if any safeguard is disconnected)
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/guard-audit.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Guard audit (fails the run if any safeguard is disconnected)" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Rebuild outputs on today's day (before the tests)
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        : > /tmp/rebuild.log
        echo "── rebuild ──" >> /tmp/rebuild.log
        ok=0; bad=0
        step() {
          if RT node "scripts/$1" > /tmp/rebuild-step.log 2>&1; then ok=$((ok+1)); echo "  ✓ rebuild: $1" >> /tmp/rebuild.log
          else bad=$((bad+1)); tail -20 /tmp/rebuild-step.log; grep -E "Error|FAIL" /tmp/rebuild-step.log | head -5 | sed 's/^/    FAIL /' >> /tmp/rebuild.log; echo "  ✗ rebuild: $1" >> /tmp/rebuild.log; fi
        }
        step build-tcgcsv-catalogue-map.mjs
        step build-premium-ratio.mjs
        step build-public-bundle.mjs
        # Score rip value after the bundle applies price holds. A held card
        # stays out. Writing rip only after the tests is why run 42245422004
        # failed on a real catalog price.
        step build-rip-roi.mjs
        # Long index history after the bundle rewrites indexes.json. Guard values
        # and the full series stay in catchem-data-private.
        step build-index-history.mjs
        step build-condition-ladder.mjs
        step build-feed.mjs
        # The first feed after a new price day still carries the previous board.
        # A second pass settles it, which is what the determinism test rebuilds.
        step build-feed.mjs
        step check-board-sync.mjs
        step write-morning-card.mjs
        step write-feature-data.mjs
        echo "" >> /tmp/rebuild.log
        echo "$ok passed · $bad failed" >> /tmp/rebuild.log
        cat /tmp/rebuild.log
        REH_EOF
        bash .github/rehearsal/r.sh "Rebuild outputs on today's day (before the tests)" /tmp/reh/cur.sh
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        FEED_FRESHNESS_WARN_ONLY: '1'
      continue-on-error: true
    - name: Refresh feed news before the test gate
      if: always()
      continue-on-error: true
      env:
        PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/fetch-tcg-news.mjs || true
        REH_EOF
        bash .github/rehearsal/r.sh "Refresh feed news before the test gate" /tmp/reh/cur.sh
    - name: Commit the feed news digest
      if: always()
      continue-on-error: true
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        git config user.name "catchem-bot"
        git config user.email "bot@catchem.app"
        git add research/digests/feed-news.json research/digests/news.json research/digests/weekly-news.json
        if git diff --staged --quiet; then
          echo "No feed news changes."
        else
          git commit -m "data: feed news $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do
            if echo "[rehearsal] push skipped"; then break; fi
            echo "push rejected (attempt $i). Rebasing onto moved main."
            git pull --rebase --autostash origin main || true
            sleep 5
          done
        fi
        REH_EOF
        bash .github/rehearsal/r.sh "Commit the feed news digest" /tmp/reh/cur.sh
    - name: Unit tests (fail-fast)
      id: tests
      env:
        FEED_FRESHNESS_WARN_ONLY: '1'
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        mkdir -p data/derived
        if RT node scripts/tests/run-tests.mjs > /tmp/tests-1.log 2>&1; then
          tail -5 /tmp/tests-1.log; cp /tmp/tests-1.log /tmp/tests.log
        else
          echo "::warning::Unit tests failed once; retrying to rule out a flake."
          grep -E "✗|FAIL" /tmp/tests-1.log | head -20 || true
          RT node scripts/tests/run-tests.mjs > /tmp/tests.log 2>&1 || cat /tmp/tests.log
        fi
        RT node scripts/triage-tests.mjs /tmp/tests.log /tmp/rebuild.log --mode nightly --out data/derived/test-triage.json
        REH_EOF
        bash .github/rehearsal/r.sh "Unit tests (fail-fast)" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Note PPT run start
      continue-on-error: true
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/note-run-start.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Note PPT run start" /tmp/reh/cur.sh
    - name: Mount private PPT history
      continue-on-error: true
      env:
        PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/mount-private-ppt.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Mount private PPT history" /tmp/reh/cur.sh
    - name: Fetch illustrator credits (pokemontcg.io)
      continue-on-error: true
      env:
        POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/fetch-artists.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Fetch illustrator credits (pokemontcg.io)" /tmp/reh/cur.sh
    - name: Slab history status
      continue-on-error: true
      env:
        PPT_SLABS_ENABLED: ${{ vars.PPT_SLABS_ENABLED }}
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/ppt-slabs.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Slab history status" /tmp/reh/cur.sh
    - name: 'Probe: private clone + pull --rebase cost'
      continue-on-error: true
      env:
        PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node .github/rehearsal/probe-private.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Probe private clone" /tmp/reh/cur.sh
    - name: Compute heat states
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/compute-heat-states.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Compute heat states" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Compute The Spread
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/compute-divergence.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Compute The Spread" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Compute Supply Watch
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/compute-supply-watch.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Compute Supply Watch" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Weekly receipts
      id: reads
      continue-on-error: true
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/compute-receipts.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Weekly receipts" /tmp/reh/cur.sh
    - name: Derived intelligence
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/compute-derived.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Derived intelligence" /tmp/reh/cur.sh
      env:
        PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
      continue-on-error: true
    - name: Repeat appearance
      continue-on-error: true
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/compute-repeat-rank.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Repeat appearance" /tmp/reh/cur.sh
    - name: Heat Check
      continue-on-error: true
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/compute-heat-check.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Heat Check" /tmp/reh/cur.sh
    - name: Set lines
      continue-on-error: true
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/compute-set-lines.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Set lines" /tmp/reh/cur.sh
    - name: TCGplayer market history (TCGCSV daily append)
      continue-on-error: true
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/backfill-tcgcsv.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "TCGplayer market history (TCGCSV daily append)" /tmp/reh/cur.sh
    - name: Full Pokémon catalog (TCGCSV)
      continue-on-error: true
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/fetch-tcgcsv-catalog.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Full Pokémon catalog (TCGCSV)" /tmp/reh/cur.sh
    - name: Build search index
      id: search
      continue-on-error: true
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/build-search-index.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Build search index" /tmp/reh/cur.sh
    - name: Split search index into shards
      continue-on-error: true
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/build-search-shards.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Split search index into shards" /tmp/reh/cur.sh
    - name: Index stress (sealed and singles)
      continue-on-error: true
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/compute-stress.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Index stress (sealed and singles)" /tmp/reh/cur.sh
    - name: Weekly Read
      continue-on-error: true
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/compute-weekly-read.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Weekly Read" /tmp/reh/cur.sh
    - name: Write PPT run report
      continue-on-error: true
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/write-run-report.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Write PPT run report" /tmp/reh/cur.sh
    - name: Commit price data (before anything reports on it)
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        git config user.name "catchem-bot"
        git config user.email "bot@catchem.app"
        mkdir -p data/raw  # eBay raw copy (#145); an empty folder adds nothing
        git add data/ppt/run-report.json data/buyout-tape.json
        git add data/tcgcsv-to-catalogue.json data/sealed-prices.json data/heat-report.json data/heat-history.json \
                data/divergence-report.json data/supply-watch.json \
                data/derived-insights.json data/era-index-history-tcg.json \
                data/catalyst-log.json data/cohort-history.json data/artists.json \
                data/indexes/ data/heat-check.json data/history/tcgplayer-market/ \
                data/catalog/tcgcsv-latest.json data/catalog/tcgcsv-coverage.json \
                data/history/tcgcsv-daily/ data/raw/ data/search/ \
                data/meta/ppt-usage.json data/meta/ppt-cursor.json \
                data/history/slabs/status.json \
                data/heartbeat.json data/derived/
        if git diff --staged --quiet; then
          echo "No price changes to commit."
        else
          git commit -m "data: sealed prices $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do
            echo "[rehearsal] push skipped" && break
            echo "push rejected (attempt $i) — rebasing onto moved main"
            git pull --rebase --autostash origin main || RT node scripts/resolve-listing-counts-conflict.mjs || true
          done
        fi
        REH_EOF
        bash .github/rehearsal/r.sh "Commit price data (before anything reports on it)" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Re-check fill-source robots
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/check-fill-robots.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Re-check fill-source robots" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Rebuild public set pages
      id: setpages
      continue-on-error: true
      env:
        PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/build-premium-ratio.mjs
        RT node scripts/build-public-bundle.mjs
        RT node scripts/build-index-history.mjs
        RT node scripts/build-condition-ladder.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Rebuild public set pages" /tmp/reh/cur.sh
    - name: Set lines for /reads (reads-preview.json)
      if: steps.setpages.outcome == 'success'
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/build-post-office-catalogue.mjs || true
        REH_EOF
        bash .github/rehearsal/r.sh "Set lines for /reads (reads-preview.json)" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Rebuild the public feed
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/build-feed.mjs || RT node scripts/withhold-group.mjs reads "rebuild: build-feed.mjs crashed after the price commit"
        REH_EOF
        bash .github/rehearsal/r.sh "Rebuild the public feed" /tmp/reh/cur.sh
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        FEED_FRESHNESS_WARN_ONLY: '1'
      continue-on-error: true
    - name: Run the read registry
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/run-read-registry.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Run the read registry" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Write the private detector report
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/write-detector-report.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Write the private detector report" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Write feature data
      env:
        PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/write-feature-data.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Write feature data" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Listings-led tracker (private)
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/run-tracker.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Listings-led tracker (private)" /tmp/reh/cur.sh
      env:
        PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
      continue-on-error: true
    - name: Refresh the morning card (today.json)
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/write-morning-card.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Refresh the morning card (today.json)" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Per-item read lookups (feed/item-reads)
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/write-item-reads.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Per-item read lookups (feed/item-reads)" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Per-item card lookups (feed/card)
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/write-card-lookups.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Per-item card lookups (feed/card)" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Stamp the Updated line from the price file
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/stamp-public-updated.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Stamp the Updated line from the price file" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Score the track record
      env:
        PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/write-track-record.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Score the track record" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Stamp signal chips
      env:
        PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        SIGNAL_STAMP_READS: '1'
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/stamp-signal-chips.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Stamp signal chips" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Synthesize item reads
      env:
        PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/synthesize-reads.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Synthesize item reads" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Guard the public reads
      env:
        PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/guard-public-reads.mjs
        RT node scripts/write-morning-card.mjs
        RT node scripts/write-item-reads.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Guard the public reads" /tmp/reh/cur.sh
      continue-on-error: true
    - name: IR and SIR watch and run stage call ledger
      continue-on-error: true
      env:
        PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/build-ir-sir-watch.mjs
        RT node scripts/log-stage-calls.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "IR and SIR watch and run stage call ledger" /tmp/reh/cur.sh
    - name: Market meter
      env:
        PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/build-market-meter.mjs --publish
        REH_EOF
        bash .github/rehearsal/r.sh "Market meter" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Publish gate
      env:
        PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/publish-gate.mjs
        REH_EOF
        bash .github/rehearsal/r.sh "Publish gate" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Withhold files whose tests failed tonight
      if: always() && steps.tests.outcome == 'success'
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        RT node scripts/withhold-artifacts.mjs data/derived/test-triage.json
        REH_EOF
        bash .github/rehearsal/r.sh "Withhold files whose tests failed tonight" /tmp/reh/cur.sh
      continue-on-error: true
    - name: Commit the rebuilt feed
      run: |
        cat > /tmp/reh/cur.sh <<'REH_EOF'
        git config user.name "catchem-bot"
        git config user.email "bot@catchem.app"
