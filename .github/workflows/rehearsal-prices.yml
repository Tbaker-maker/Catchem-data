            echo "push rejected (attempt $i) — rebasing onto moved main"
            git pull --rebase --autostash origin main || RT node scripts/resolve-listing-counts-conflict.mjs || exit 1
            sleep 5
          done
          if [ "$pushed" != 1 ]; then
            echo "feed commit was not pushed"
            exit 1
          fi
        fi
