name: pr-tests
# Full test suite on every PR and on main. PR #142: PR checks only ran PPT
# safety, so a merge could break the nightly's first step (run-tests).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    # One suite run took about 19 minutes on PR #501 (run 43129428719: 00:45 to
    # 01:04 UTC, base run 01:04 to 01:22). A red PR runs it a second time on the
    # base commit (below), so allow two runs plus setup with room to spare.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # artifact-freshness reads git log
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Patch guard audit for CI
        run: node scripts/patch-guard-audit-ci.mjs
      - name: Guard audit
        run: node scripts/guard-audit.mjs
      - name: Artifact freshness
        # Main's data age is not a pull request's code. When the nightly is late,
        # this went red on every crew PR at once (Oct 23 to 26). It runs on main only;
        # the nightly issue and the watchdog report a stale main.
        if: github.event_name != 'pull_request'
        run: node scripts/artifact-freshness.mjs
      - name: Full test suite
        # Every failing test blocks a PR except main's own freshness checks
        # (scripts/lib/test-tiers.mjs, pr mode), and except a test that fails
        # the same way on the base commit. Main's committed outputs go stale
        # when a nightly misses (Nov 9 to 11: 7 suites red on every PR, PR #504
        # and #506 included). That is main's state, not the PR's code. The old
        # fix (PR #501) rebuilt every output first and took about 2 hours.
        # Here the suite runs on the base commit only when the PR is red, and
        # only a failure the base does not have blocks
        # (scripts/lib/test-baseline.mjs). No finished base log = every failure blocks.
        # Pushes to main have no base to compare with and keep the plain rule.
        env:
          FEED_FRESHNESS_WARN_ONLY: "1" # same as the nightly test gate: staleness is reported, not failed
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p data/derived
          set +e
          node scripts/tests/run-tests.mjs > /tmp/tests.log 2>&1
          code=$?
          tail -40 /tmp/tests.log
          grep -E "✗|FAIL" /tmp/tests.log | head -40
          set -e
          if [ "$code" = 0 ]; then exit 0; fi
          if node scripts/triage-tests.mjs /tmp/tests.log --mode pr --out /tmp/test-triage.json; then exit 0; fi
          if [ "${{ github.event_name }}" != "pull_request" ] || [ -z "$BASE_SHA" ]; then exit 1; fi
          echo "::group::Same suite on the base commit $BASE_SHA"
          git worktree add -q --detach /tmp/base "$BASE_SHA"
          ln -s "$PWD/node_modules" /tmp/base/node_modules
          (cd /tmp/base && mkdir -p data/derived && node scripts/tests/run-tests.mjs > /tmp/base-tests.log 2>&1) || true
          tail -3 /tmp/base-tests.log
          echo "::endgroup::"
          node scripts/test-baseline.mjs /tmp/tests.log /tmp/base-tests.log
      - name: Publish gate (report only)
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/publish-gate.mjs --check > /tmp/gate.log || true; head -1 /tmp/gate.log
      - name: No schedule in daily-research
        run: |
          if grep -E '^[[:space:]]*schedule:' .github/workflows/daily-research.yml; then
            echo "FAIL: daily-research.yml has a schedule. Remove it."
            exit 1
          fi
          echo "OK: no schedule in daily-research.yml"

