name: pr-tests
# Full test suite on every PR and on main. PR #142: PR checks only ran PPT
# safety, so a merge could break the nightly's first step (run-tests).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # artifact-freshness reads git log
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Patch guard audit for CI
        run: node scripts/patch-guard-audit-ci.mjs
      - name: Guard audit
        run: node scripts/guard-audit.mjs
      - name: Artifact freshness
        # Main's data age is not a pull request's code. When the nightly is late,
        # this went red on every crew PR at once (Oct 23 to 26). It runs on main only;
        # the nightly issue and the watchdog report a stale main.
        if: github.event_name != 'pull_request'
        run: node scripts/artifact-freshness.mjs
      - name: Rebuild the public bundle
        # The nightly tests the bundle it just built. A pull request used to
        # test yesterday's committed reads.json, go green, and then break that
        # rebuild. Same builders, same order, before the suites.
        run: |
          : > /tmp/rebuild.log
          echo "── rebuild ──" >> /tmp/rebuild.log
          ok=0; bad=0
          step() {
            if node "scripts/$1" > /tmp/rebuild-step.log 2>&1; then ok=$((ok+1)); echo "  ✓ rebuild: $1" >> /tmp/rebuild.log
            else bad=$((bad+1)); tail -20 /tmp/rebuild-step.log; echo "  ✗ rebuild: $1" >> /tmp/rebuild.log; fi
          }
          step build-tcgcsv-catalogue-map.mjs
          step build-premium-ratio.mjs
          step build-public-bundle.mjs
          step build-index-history.mjs
          step build-condition-ladder.mjs
          step build-feed.mjs
          step build-feed.mjs
          step check-board-sync.mjs
          step write-morning-card.mjs
          step write-feature-data.mjs
          echo "" >> /tmp/rebuild.log
          echo "$ok passed · $bad failed" >> /tmp/rebuild.log
          cat /tmp/rebuild.log
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
          FEED_FRESHNESS_WARN_ONLY: "1"
      - name: Full test suite
        # Every failing test blocks a PR except main's own freshness checks
        # (scripts/lib/test-tiers.mjs, pr mode).
        run: |
          mkdir -p data/derived
          set +e
          node scripts/tests/run-tests.mjs > /tmp/tests.log 2>&1
          code=$?
          tail -40 /tmp/tests.log
          grep -E "✗|FAIL" /tmp/tests.log | head -40
          set -e
          if [ "$code" = 0 ]; then exit 0; fi
          node scripts/triage-tests.mjs /tmp/tests.log --mode pr --out /tmp/test-triage.json
      - name: Publish gate (report only)
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/publish-gate.mjs --check > /tmp/gate.log || true; head -1 /tmp/gate.log
      - name: No schedule in daily-research
        run: |
          if grep -E '^[[:space:]]*schedule:' .github/workflows/daily-research.yml; then
            echo "FAIL: daily-research.yml has a schedule. Remove it."
            exit 1
          fi
          echo "OK: no schedule in daily-research.yml"

