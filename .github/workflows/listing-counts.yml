# Paste in GitHub web UI as .github/workflows/listing-counts.yml
# Two full runs (6 AM and 6 PM PT) plus one small midday run (noon PT) that only
# recounts top items not yet counted today. The 6 PM PT full run samples the
# top WOTC listings first, in this job, so a late cron cannot start after the
# counter is already full. Other listing runs keep those 300 calls until that
# sample has logged for the Pacific day. The 9 PM PT nightly sealed step then
# retries any top item still missing. All runs share one rolling 24-hour counter
# (4,900 of 5,000 eBay calls) and stop at the first 429. Times are UTC (PDT).
name: Listing counts

on:
  schedule:
    - cron: "0 13 * * *"   # 6 AM PT full
    - cron: "0 19 * * *"   # noon PT top-tier only
    - cron: "0 1 * * *"    # 6 PM PT full
    - cron: "30 2 * * *"   # 7:30 PM PT count guardian (daily-tier items still missing today)
    - cron: "0 5 * * *"    # 10 PM PT count guardian
  workflow_dispatch:
    inputs:
      role:
        description: "full, top or guardian"
        default: "full"

permissions:
  contents: write

concurrency:
  group: listing-counts
  cancel-in-progress: false

jobs:
  count:
    # Shared eBay key: queue with the sealed price run, never overlap.
    concurrency:
      group: ebay
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vintage sample before the 6 PM PT full run
        if: github.event.schedule == '0 1 * * *'
        continue-on-error: true
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/fetch-vintage-sample.mjs
      - name: Listing counts (eBay slice)
        continue-on-error: true
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          LISTING_RUN_ROLE: ${{ github.event.schedule == '0 19 * * *' && 'top' || (github.event.schedule == '30 2 * * *' || github.event.schedule == '0 5 * * *') && 'guardian' || inputs.role || 'full' }}
        run: node scripts/fetch-listing-counts.mjs
      - name: Status file
        continue-on-error: true
        run: node scripts/freshness-bot.mjs
      - name: Commit counts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/derived/listing-counts/ data/derived/status.json data/derived/vintage-sample.json research/assets/public/price-hold.json research/assets/public/condition-prices.json research/assets/public/sets
          git diff --cached --quiet && exit 0
          git commit -m "data: listing counts $(date -u +'%Y-%m-%dT%H:%MZ')"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 15))
          done
          exit 1
