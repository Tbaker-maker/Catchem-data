# Paste in GitHub web UI as .github/workflows/listing-counts.yml
# Five extra listing-count runs; the 9 PM PT nightly is the sixth.
# Each run spends an even share of the day under a rolling 24-hour counter
# (4,900 of 5,000 eBay calls) and stops at the first 429.
name: Listing counts

on:
  schedule:
    - cron: "0 0,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listing-counts
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Listing counts (eBay slice)
        continue-on-error: true
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: node scripts/fetch-listing-counts.mjs
      - name: Commit counts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/derived/listing-counts/
          git diff --cached --quiet && exit 0
          git commit -m "data: listing counts $(date -u +'%Y-%m-%dT%H:%MZ')"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 15))
          done
          exit 1
