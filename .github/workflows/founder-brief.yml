name: Founder brief

# Sunday morning Pacific. 15:00 UTC is 8 AM during daylight time.
# 16:00 UTC is 8 AM during standard time. Actions often starts these
# late, so the script writes on any Sunday Pacific hour. The job
# fails if that run does not leave a brief.
on:
  schedule:
    - cron: "0 15 * * 0"
    - cron: "0 16 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Write the weekly brief
        env:
          BRIEF_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/build-founder-brief.mjs
      - name: Commit the brief
        run: |
          git config user.name "catchem-bot"
          git config user.email "bot@catchem.app"
          day=$(TZ=America/Vancouver date +%F)
          git add data/derived/brief/
          if git diff --staged --quiet; then
            if git cat-file -e "HEAD:data/derived/brief/${day}.md" 2>/dev/null; then
              echo "Brief for ${day} is already on main."
            else
              echo "Founder brief wrote nothing for ${day}."
              exit 1
            fi
          else
            git commit -m "Weekly founder brief (${day})"
            git push
          fi