name: Nightly pre-check

on:
  schedule:
    # 02:00 UTC, two hours before the 04:00 UTC sealed-prices nightly.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Same data tests, dry
        id: tests
        run: |
          set +e
          node scripts/patch-guard-audit-ci.mjs > /tmp/precheck.log 2>&1
          node scripts/guard-audit.mjs >> /tmp/precheck.log 2>&1
          node scripts/artifact-freshness.mjs >> /tmp/precheck.log 2>&1
          node scripts/tests/run-tests.mjs >> /tmp/precheck.log 2>&1
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          tail -50 /tmp/precheck.log
          exit 0
      - name: Open issue on failure
        if: steps.tests.outputs.exit != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/precheck.log', 'utf8');
            const line = log.split('\n').find((row) => /\bFAIL\b/.test(row)) || 'data tests';
            const named = (line.match(/FAIL\s+(.+)/) || [null, 'data tests'])[1].replace(/\s+/g, ' ').slice(0, 80);
            const tail = log.slice(-3500);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly will fail: ' + named,
              body: 'Pre-check ran the data tests on a dry rebuild and did not publish.\n\n```\n' + tail + '\n```\n\nThe 04:00 UTC nightly still runs its tests. This job does not skip them.',
            });
      - name: Fail when the dry run failed
        if: steps.tests.outputs.exit != '0'
        run: exit 1
