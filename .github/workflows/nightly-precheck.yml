name: Nightly pre-check

on:
  schedule:
    # 02:00 UTC, two hours before the 04:00 UTC sealed-prices nightly.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Same data tests, dry
        # Same tiers as the nightly (scripts/lib/test-tiers.mjs): only what would
        # stop tonight's prices fails this check. Withheld groups and main's own
        # freshness are reported in the summary and the one nightly issue.
        id: tests
        run: |
          set +e
          mkdir -p data/derived
          node scripts/patch-guard-audit-ci.mjs > /tmp/precheck.log 2>&1
          node scripts/guard-audit.mjs >> /tmp/precheck.log 2>&1
          guard=$?
          node scripts/artifact-freshness.mjs >> /tmp/precheck.log 2>&1 || echo "::notice::main's artifacts are stale; tonight's nightly refreshes them."
          node scripts/tests/run-tests.mjs > /tmp/tests.log 2>&1
          node scripts/triage-tests.mjs /tmp/tests.log --mode nightly --out data/derived/test-triage.json
          code=$?
          [ "$guard" != 0 ] && code=1
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          tail -50 /tmp/tests.log
          exit 0
      - name: Open or update the nightly test issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/nightly-issue.mjs data/derived/test-triage.json
      - name: Fail when the dry run would block tonight's prices
        if: steps.tests.outputs.exit != '0'
        run: exit 1
