name: Update sealed prices

on:
  schedule:
    # Daily at 4:00 AM UTC (midnight EST, 9 PM PST previous day)
    - cron: "0 4 * * *"
  workflow_dispatch: # Allows manual runs from the Actions tab

# One price run at a time. Two runs at once raced each other's pushes on
# Oct 15 and the second went red. A new run waits; it never cancels one mid-commit.
concurrency:
  group: update-sealed-prices
  cancel-in-progress: false

jobs:
  update:
    # Shared eBay key: queue behind Listing counts and Vintage sample, never overlap.
    concurrency:
      group: ebay
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needs write access to commit updated prices back
      actions: read # The failure summary reads this run's own step results
      issues: write # A refused or rolled back publish opens an issue
    steps:
      - name: Checkout
        # The branch tip at checkout time, not the commit the run was queued on.
        # A queued or rerun nightly used to test the code from before the fix
        # that was merged while it waited (Oct 23 to 26).
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # Full commit history, blobs on demand. The default depth 1 checkout
          # made `git log -- <file>` report today's commit for every file, so
          # the memory guard in Generate Morning Pulse read the knowledge base
          # as "changed today" (it last changed 2026-08-27) and failed the run
          # once the stamp passed its 60 day grace on 2026-10-26.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (resvg — cards rasterize to PNG in CI)
        # package.json declares @resvg/resvg-js; without this install the
        # rasterizer skips gracefully and the daily cards stay SVG-only.
        run: npm install --no-audit --no-fund

      - name: Write today's TCGCSV catalog day
        # Before the guard audit and the unit tests, so a fail-fast step above
        # the price commit can no longer skip the day (09-28, 09-30, 10-01,
        # 10-02 and 10-04 were lost that way). Those five days stay gaps. Do not
        # backfill them. The later "Full Pokémon catalog
        # (TCGCSV)" step still runs and rewrites the same day. continue-on-error
        # so a TCGCSV outage cannot stop the run.
        id: tcgcsv-day
        continue-on-error: true
        run: node scripts/fetch-tcgcsv-catalog.mjs

      - name: Commit today's TCGCSV day
        # Stages the day and the catalog built from that day. The price commit
        # later also stages the catalog, but unit tests sit between them and
        # fail-fast skips it. On 2026-10-31 the day was pushed and the catalog
        # (moved to that day on disk) was left behind, so main went red.
        # This step runs even when the day file is unchanged, because a rerun
        # still has to commit the catalog rebuilt from the published day.
        if: always()
        continue-on-error: true
        run: |
          git config user.name "catchem-bot"
          git config user.email "bot@catchem.app"
          if ! git add data/history/tcgcsv-daily/ data/catalog/tcgcsv-latest.json data/catalog/tcgcsv-coverage.json; then
            echo "::warning::Could not stage the TCGCSV day and catalog; the price commit below stages them again."
          fi
          if git diff --staged --quiet; then
            echo "No new TCGCSV day or catalog."
          else
            git commit -m "data: tcgcsv day $(date -u +'%Y-%m-%d')"
            pushed=0
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              echo "push rejected (attempt $i). Rebasing onto moved main."
              git pull --rebase --autostash origin main || node scripts/resolve-listing-counts-conflict.mjs || true
            done
            if [ "$pushed" != "1" ]; then
              echo "::warning::TCGCSV day was committed locally but not pushed after 3 tries. The price commit push below carries it."
            fi
          fi

      - name: Preflight patch guard-audit (deep script lookback + registered env bridge)
        run: node scripts/patch-guard-audit-ci.mjs

      - name: Guard audit (fails the run if any safeguard is disconnected)
        run: node scripts/guard-audit.mjs

      - name: Rebuild outputs on today's day (before the tests)
        # The tests compare committed outputs against the newest TCGCSV day,
        # which the step above just wrote. Rebuild them first so a new day does
        # not turn main red (2026-10-13). The same scripts run again below.
        # Every builder runs even when one fails, and each failure is written to
        # /tmp/rebuild.log in the test log format. The triage below decides:
        # a price page builder blocks, a reads or feature builder withholds its
        # files (docs/nightly-failures-2026-10.md).
        run: |
          : > /tmp/rebuild.log
          echo "── rebuild ──" >> /tmp/rebuild.log
          ok=0; bad=0
          step() {
            if node "scripts/$1" > /tmp/rebuild-step.log 2>&1; then ok=$((ok+1)); echo "  ✓ rebuild: $1" >> /tmp/rebuild.log
            else bad=$((bad+1)); tail -20 /tmp/rebuild-step.log; grep -E "Error|FAIL" /tmp/rebuild-step.log | head -5 | sed 's/^/    FAIL /' >> /tmp/rebuild.log; echo "  ✗ rebuild: $1" >> /tmp/rebuild.log; fi
          }
          step build-tcgcsv-catalogue-map.mjs
          step build-premium-ratio.mjs
          step build-public-bundle.mjs
          # Long index history after the bundle rewrites indexes.json. Guard values
          # and the full series stay in catchem-data-private.
          step build-index-history.mjs
          step build-condition-ladder.mjs
          step build-feed.mjs
          # The first feed after a new price day still carries the previous board.
          # A second pass settles it, which is what the determinism test rebuilds.
          step build-feed.mjs
          step check-board-sync.mjs
          step write-morning-card.mjs
          step write-feature-data.mjs
          echo "" >> /tmp/rebuild.log
          echo "$ok passed · $bad failed" >> /tmp/rebuild.log
          cat /tmp/rebuild.log
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
          FEED_FRESHNESS_WARN_ONLY: "1" # stale files are what this run refreshes

      - name: Unit tests (fail-fast)
        # The same suites as a pull request, on tonight's rebuilt bundle.
        # One run. A failure opens "Nightly run failed <date>" and stops.
        # Nothing is retried and nothing is published after a red test.
        id: tests
        env:
          FEED_FRESHNESS_WARN_ONLY: "1" # staleness is checked strict after the refresh
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/derived
          set +e
          node scripts/tests/run-tests.mjs > /tmp/tests.log 2>&1
          code=$?
          node scripts/triage-tests.mjs /tmp/tests.log /tmp/rebuild.log --mode nightly --out data/derived/test-triage.json
          status=$?
          set -e
          if [ "$code" != 0 ]; then
            node scripts/nightly-issue.mjs data/derived/test-triage.json || true
          fi
          if [ "$status" != 0 ]; then
            echo "Nightly tests failed. Not retrying and not publishing."
            exit 1
          fi

      - name: Note PPT run start
        continue-on-error: true
        run: node scripts/note-run-start.mjs

      - name: Fetch sealed prices from eBay
        id: ebay
        # eBay is one source, never the gate. A 429 or a wipe guard trip keeps
        # yesterday's eBay values (the guard never overwrites the file) and the
        # run carries on so TCGCSV and PPT still publish every day.
        continue-on-error: true
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/fetch-sealed-prices.mjs
      - name: Mount private PPT history
        # Before the crosscheck and the refresh, so a product that already has
        # history is estimated at 1 credit instead of 2. Missing token or a
        # down repo logs and continues. Nothing here is committed.
        continue-on-error: true
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/mount-private-ppt.mjs
      - name: Fetch TCG crosscheck (PPT)
        continue-on-error: true # a PPT hiccup must never kill the sealed run
        env:
          POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
        run: node scripts/fetch-sealed-crosscheck.mjs
      - name: PPT budgeted refresh
        # No key: the script logs credits 0 and exits 0. Raw never lands in data/.
        continue-on-error: true
        env:
          POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/ppt-refresh.mjs
      - name: Push raw PPT to private repo
        # No token or a failed clone logs and exits 0. The token is not printed.
        # Raw stays out of public artifacts.
        if: always()
        continue-on-error: true
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/push-private-ppt.mjs
      - name: Fetch illustrator credits (pokemontcg.io)
        continue-on-error: true # a flaky free API must never kill the sealed run
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: node scripts/fetch-artists.mjs
      - name: Slab history status
        # Writes how many slabs qualify. Does not call PPT unless a later change
        # turns the pull on. continue-on-error so it cannot drop the price commit.
        continue-on-error: true
        env:
          POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
          PPT_SLABS_ENABLED: ${{ vars.PPT_SLABS_ENABLED }}
        run: node scripts/ppt-slabs.mjs
      - name: Compute heat states
        run: node scripts/compute-heat-states.mjs
      - name: Compute The Spread
        run: node scripts/compute-divergence.mjs
      - name: Compute Supply Watch
        run: node scripts/compute-supply-watch.mjs
      - name: Weekly receipts
        id: reads
        # Reads we tracked. continue-on-error so a quiet week cannot drop the price commit.
        # An empty write still fails the job after the price commit.
        continue-on-error: true
        run: node scripts/compute-receipts.mjs
      - name: Derived intelligence
        # Runs the eBay vs TCGplayer price sanity check first; its full report goes private.
        run: node scripts/compute-derived.mjs
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
      - name: Repeat appearance
        # Counts only. continue-on-error so a short tape cannot drop the price commit.
        continue-on-error: true
        run: node scripts/compute-repeat-rank.mjs
      - name: Heat Check
        # Local file only. continue-on-error so a score failure cannot throw away
        # the price commit that follows.
        continue-on-error: true
        run: node scripts/compute-heat-check.mjs
      - name: Set lines
        # Sealed line and chase line, never averaged. continue-on-error so a thin tape cannot drop the price commit.
        continue-on-error: true
        run: node scripts/compute-set-lines.mjs
      - name: TCGplayer market history (TCGCSV daily append)
        # Appends today's live TCGCSV market price to each matched product's
        # file in data/history/tcgplayer-market/. Never rewrites earlier days;
        # a day that fails is written as a gap. continue-on-error so a TCGCSV
        # outage cannot throw away the price commit that follows.
        continue-on-error: true
        run: node scripts/backfill-tcgcsv.mjs
      - name: Full Pokémon catalog (TCGCSV)
        # One live day for every English single and sealed product. Earlier
        # days are not rewritten. continue-on-error so a TCGCSV outage cannot
        # throw away the price commit that follows.
        continue-on-error: true
        run: node scripts/fetch-tcgcsv-catalog.mjs
      - name: Build search index
        id: search
        # Reads the catalog written just above. continue-on-error so a search
        # build failure cannot throw away the price commit that follows.
        # An empty index still fails the job after the price commit.
        continue-on-error: true
        run: node scripts/build-search-index.mjs
      - name: Split search index into shards
        # The phone loads the manifest and one or two shards, not the whole index.
        # continue-on-error so a shard failure cannot throw away the price commit.
        continue-on-error: true
        run: node scripts/build-search-shards.mjs
      - name: Index stress (sealed and singles)
        # Recommendations only. continue-on-error so a stress failure cannot
        # throw away the price commit that follows.
        continue-on-error: true
        run: node scripts/compute-stress.mjs
      - name: Weekly Read
        # Four-part outline. continue-on-error so a missing section cannot drop the price commit.
        continue-on-error: true
        run: node scripts/compute-weekly-read.mjs
      - name: Write PPT run report
        # Counts only. continue-on-error so a missing log cannot drop the price commit.
        continue-on-error: true
        run: node scripts/write-run-report.mjs
      # ── THE DATA COMMITS BEFORE ANYTHING REPORTS ON IT ────────────────────
      # Six consecutive runs fetched prices, computed heat states and threw all
      # of it away, because "Generate Morning Pulse" sits above the commit and a
      # guard inside it exited non-zero. The prices were CORRECT every time —
      # the last run reached "freshness: 100% of 177 products at 2026-08-26" and
      # then discarded it.
      #
      # Market data and publication reporting are different concerns and only
      # one of them is time-critical. A citation backlog, an un-interrogated
      # guard or a dash on a card published five days ago are all real findings,
      # and none of them is a reason for catchemtcg.com to show prices from last
      # Saturday.
      #
      # So the DATA commits here, as soon as it is computed and its own data
      # guards have passed. Everything downstream still runs, still reports, and
      # still fails the job loudly if it should — it simply can no longer take
      # the prices with it.
      - name: Commit price data (before anything reports on it)
        run: |
          git config user.name "catchem-bot"
          git config user.email "bot@catchem.app"
          mkdir -p data/raw  # eBay raw copy (#145); an empty folder adds nothing
          git add data/ppt/run-report.json data/buyout-tape.json
          git add data/tcgcsv-to-catalogue.json data/sealed-prices.json data/heat-report.json data/heat-history.json \
                  data/divergence-report.json data/supply-watch.json \
                  data/derived-insights.json data/era-index-history-tcg.json \
                  data/catalyst-log.json data/cohort-history.json data/artists.json \
                  data/indexes/ data/heat-check.json data/history/tcgplayer-market/ \
                  data/catalog/tcgcsv-latest.json data/catalog/tcgcsv-coverage.json \
                  data/history/tcgcsv-daily/ data/raw/ data/search/ \
                  data/meta/ppt-usage.json data/meta/ppt-cursor.json \
                  data/history/slabs/status.json \
                  data/heartbeat.json data/derived/
          if git diff --staged --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "data: sealed prices $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git push && break
              echo "push rejected (attempt $i) — rebasing onto moved main"
              git pull --rebase --autostash origin main || node scripts/resolve-listing-counts-conflict.mjs || true
            done
          fi

      - name: Re-check fill-source robots
        # Nightly robots.txt re-check for every fill source (config/fill-sources.json).
        # A source whose robots now blocks us is marked robotsBlocked and drops out of the charts.
        # Network errors are caught per source inside the script, so this step does not fail the run.
        run: node scripts/check-fill-robots.mjs

      - name: Rebuild public set pages
        # Before the feed build, so build-feed.mjs (with sold facts, extras and
        # rotation) writes the final feed. The bundle throws before any write if
        # the catalog is empty. continue-on-error so a set-page failure cannot
        # drop tonight's feed; a failed run's set files are discarded below.
        id: setpages
        continue-on-error: true
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          node scripts/build-premium-ratio.mjs
          node scripts/build-public-bundle.mjs
          node scripts/build-index-history.mjs
          node scripts/build-condition-ladder.mjs

      - name: Set lines for /reads (reads-preview.json)
        # Built from tonight's set pages, before the feed commit, so the
        # public-data branch carries tonight's set lines and not last night's.
        if: steps.setpages.outcome == 'success'
        run: node scripts/build-post-office-catalogue.mjs || true

      - name: Rebuild the public feed
        # After the price commit, not before. The catalog day stays the full
        # TCGCSV day. A later partial file is used only for a product that has
        # that print. A feed build that crashes withholds the reads group (its
        # files go back to the last committed copy) instead of stopping the
        # publish of tonight's prices.
        run: |
          node scripts/build-feed.mjs || node scripts/withhold-group.mjs reads "rebuild: build-feed.mjs crashed after the price commit"
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
          FEED_FRESHNESS_WARN_ONLY: "1" # the pulse is regenerated later in this run

      - name: Run the read registry
        run: node scripts/run-read-registry.mjs

      - name: Write the private detector report
        run: node scripts/write-detector-report.mjs

      - name: Write feature data
        # The IR cycle order reads its weights from catchem-data-private (read only).
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/write-feature-data.mjs

      - name: Listings-led tracker (private)
        # Scores listing-count trends with price and heat state; picks and backtest go to the
        # private repo only. No public output.
        run: node scripts/run-tracker.mjs
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Refresh the morning card (today.json)
        # Built from tonight's reads.json. Nothing else writes it, and build-feed's
        # health check fails once it is 3 days behind.
        run: node scripts/write-morning-card.mjs

      - name: Per-item read lookups (feed/item-reads)
        # Small bucket files so item pages never load all of reads.json.
        run: node scripts/write-item-reads.mjs

      - name: Per-item card lookups (feed/card)
        # Images, IR rows and the condition note split small for card pages.
        run: node scripts/write-card-lookups.mjs

      - name: Stamp the Updated line from the price file
        # Site pages read counts.json for the Updated line. That clock is the
        # timestamp already on sealed-prices.json, not the last public bundle.
        # A price file with no updatedAt leaves the line as it is.
        run: node scripts/stamp-public-updated.mjs

      - name: Score the track record
        # Takes are scored from the daily TCGplayer market on exact days 14, 28,
        # and 56. This step is not continue-on-error. The scored rows go to
        # catchem-data-private (or gitignored data/private/ when no token is set).
        # The public file written here is the stub only.
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/write-track-record.mjs

      - name: Stamp signal chips
        # Chip words only. The cutoffs stay in catchem-data-private.
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
          SIGNAL_STAMP_READS: "1"
        run: node scripts/stamp-signal-chips.mjs

      - name: Synthesize item reads
        # Each read about one product becomes a 2 to 3 sentence summary of every
        # signal on file for it, led by its most notable finding. Before the guard,
        # so the guard checks the new copy. Limits and weights stay in
        # catchem-data-private. Without them the reads are left as they were.
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/synthesize-reads.mjs

      - name: Guard the public reads
        # Leaves out reads built on a one night jump, a there and back flip, or a
        # price that sat exactly still, plus listings reads with no change. Fixes
        # chips that disagree with their read, carried eBay ask dates, and missing
        # pictures. Limits stay in catchem-data-private. The morning card and item
        # lookups are written again from the guarded reads.
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          node scripts/guard-public-reads.mjs
          node scripts/write-morning-card.mjs
          node scripts/write-item-reads.mjs

      - name: IR and SIR watch and run stage call ledger
        # Every Illustration Rare and Special Illustration Rare: baselines, set peers,
        # listings counted, run stage, rotation. Public facts to feed/ir-sir.json;
        # cutoffs, weights, scores, the backtest and the run stage call ledger
        # (day 7, 14 and 30 checks) stay in catchem-data-private.
        continue-on-error: true
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          node scripts/build-ir-sir-watch.mjs
          node scripts/log-stage-calls.mjs

      - name: Market meter
        # After sealed prices and the call ledger, before the publish gate.
        # Premium ratio has no dated history in this workflow, so it is not an
        # input. A missing private spec writes nothing new. Do not add data/private/.
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/build-market-meter.mjs --publish

      - name: Publish gate
        # Drops single bad reads with a logged reason; fails only on systemic breakage.
        # The stability bar is read from catchem-data-private. The numbers stay there.
        # The meter rule needs the private minimum, so the spec is loaded here too.
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/publish-gate.mjs

      - name: Withhold files whose tests failed tonight
        # Puts each withheld group's public files back to the last committed copy
        # (or leaves out a new one), so the feed commit and the publish never
        # carry a file that failed its own test. Prices are not in any group.
        if: always() && steps.tests.outcome == 'success'
        run: node scripts/withhold-artifacts.mjs data/derived/test-triage.json

      - name: Commit the rebuilt feed
        run: |
          git config user.name "catchem-bot"
          git config user.email "bot@catchem.app"
          SET_PATHS="research/assets/public/sets.json research/assets/public/sets research/assets/public/buckets research/assets/public/artists research/assets/public/artists.json research/assets/public/search-lite.json research/assets/public/redirects.json research/assets/public/indexes.json research/assets/public/movers.json research/assets/public/receipts.json research/assets/public/accuracy.json research/assets/public/search-rank.mjs research/assets/public/sitemap.xml"
          if [ "${{ steps.setpages.outcome }}" = "success" ]; then
            for p in $SET_PATHS; do if [ -e "$p" ]; then git add "$p"; fi; done
            if compgen -G "research/assets/public/sitemap-*.xml" > /dev/null; then git add research/assets/public/sitemap-*.xml; fi
          else
            echo "::warning::Set-page rebuild failed; keeping yesterday's set pages."
            for p in $SET_PATHS; do git checkout -q -- "$p" 2>/dev/null || true; done
            git clean -fdq -- research/assets/public/sets research/assets/public/buckets research/assets/public/artists || true
          fi
          # The track-record path is the public stub. Do not add data/private/.
          git add research/assets/public/reads.json research/assets/public/today.json research/assets/public/feed/ research/assets/public/counts.json research/assets/public/sparks research/assets/public/track-record.json research/assets/public/set-value research/assets/public/rotation-status.json research/assets/public/releases.json research/assets/public/listings-counted.json research/assets/public/signal-chips.json research/assets/public/premium-ratio.json research/assets/public/market-meter.json
          if [ -e research/assets/public/reads-preview.json ]; then git add research/assets/public/reads-preview.json; fi
          if git diff --cached --name-only -- data/private | grep -q .; then
            echo "private scores must not be committed here"
            exit 1
          fi
          if git diff --staged --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "data: public feed $(date -u +'%Y-%m-%d')"
            pushed=0
            for i in 1 2 3; do
              if git push; then
                pushed=1
                break
              fi
              echo "push rejected (attempt $i) — rebasing onto moved main"
              git pull --rebase --autostash origin main || node scripts/resolve-listing-counts-conflict.mjs || exit 1
              sleep 5
            done
            if [ "$pushed" != 1 ]; then
              echo "feed commit was not pushed"
              exit 1
            fi
          fi

      - name: Publish the public-data branch
        # One orphan commit of research/assets/public, same paths, no history.
        # This branch is overwritten every night. Only refs/heads/public-data is force-pushed.
        # Main still receives the feed commit above.
        # Before the push: the old tip is saved as public-data-backup, and the new
        # build must pass the file, date and reads checks and the smoke test, or
        # nothing is pushed. After the push: the live site is checked and the
        # backup is put back if it fails. Limits stay in catchem-data-private.
        id: publish
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/publish-public-data.mjs --push

      - name: Open an issue when the publish was refused or rolled back
        if: failure() && steps.publish.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(cat data/derived/publish-report.json 2>/dev/null || echo 'no report written')"
          gh issue create --title "public-data publish refused or rolled back ($(date -u +%F))" --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          $body" || echo "issue not opened"

      - name: Open or update the nightly test issue
        # One issue, updated every red or degraded night with the failing test
        # names, closed on the first clean night. Also when the tests blocked.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/nightly-issue.mjs data/derived/test-triage.json

      - name: Fail if reads, search, or the index wrote nothing
        # Reads, search, and the public index may fail without dropping the
        # price commit. This step is the red X when one of them wrote nothing.
        # The five missing days stay null. Unpriced rows stay unpriced.
        if: always()
        env:
          READS_OUTCOME: ${{ steps.reads.outcome }}
          SEARCH_OUTCOME: ${{ steps.search.outcome }}
          INDEX_OUTCOME: ${{ steps.setpages.outcome }}
        run: node scripts/check-publish-writes.mjs

      - name: Fetch TCG news
        # After the price commit and the feed rebuild. A failed fetch fails the job.
        # The four research checks stay on the earlier continue-on-error step.
        # This step does not call eBay.
        run: node scripts/fetch-tcg-news.mjs
        env:
          # Japan-only items left out are logged to catchem-data-private only.
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Write the weekly letter
        continue-on-error: true
        run: node scripts/compute-weekly-read.mjs

      - name: Grade repo jobs
        continue-on-error: true
        run: node scripts/audit-repo-bots.mjs

      - name: Append shelf counts to the private log
        continue-on-error: true
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/append-shelf.mjs

      - name: Generate Morning Pulse
        run: node scripts/generate-pulse.mjs
      - name: Generate The Board
        run: node scripts/generate-board.mjs
      - name: Build creator pages
        run: |
          node scripts/build-creators-page.mjs
          node scripts/build-editor.mjs
          node scripts/build-faq.mjs
      # mint-cards.mjs was in NO workflow, while run-tests.mjs asserted the
      # cards it produces. So the tests were checking committed fossils, and
      # when one was deleted the fail-fast gate killed the whole daily run.
      # A test may assert an artifact only if something in the pipeline makes it.
      - name: Mint the share cards
        run: node scripts/mint-cards.mjs
      # Cards are MINTED as SVG above and were never rasterised, because this
      # step existed in no workflow at all. The committed PNGs were therefore
      # stale, and the current one shipped with an empty box where the product
      # photo belongs — the SVG carries a remote href and a rasteriser cannot
      # fetch over the network, so the image has to be embedded first. That is
      # exactly what this script does, and nothing was calling it.
      - name: Rasterize cards to PNG (embeds images first)
        run: node scripts/rasterize-cards.mjs
      - name: Discord alerts
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/send-discord-alerts.mjs

      - name: Dated reads, rip value, and status
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: |
          node scripts/build-condition-prices.mjs || true
          node scripts/build-weekly.mjs || true
          node scripts/build-market-signals.mjs || true
          node scripts/build-variant-flags.mjs || true
          node scripts/build-rip-roi.mjs || true
          node scripts/coverage-bot.mjs || true
          node scripts/grade-heading-votes.mjs || true
          node scripts/scanner-weekly.mjs || true
          node scripts/price-sanity.mjs || true
          node scripts/freshness-bot.mjs || true
          node scripts/build-limits.mjs || true
          node scripts/build-post-office-catalogue.mjs || true
          node scripts/publish-gate.mjs --preview-only || true
          node scripts/build-custom-reads.mjs || true
          node scripts/build-release-scout.mjs || true
          node scripts/build-canada-gap.mjs || true

      - name: Member Custom Reads (site worker outbox)
        # Saved follows come from the site worker and the night's DMs go back
        # to it for the bot. Nothing about a member is committed here (public
        # repo). Skips cleanly until CUSTOM_READS_TOKEN is set. Never fails the run.
        env:
          CUSTOM_READS_TOKEN: ${{ secrets.CUSTOM_READS_TOKEN }}
        run: node scripts/build-custom-reads-members.mjs || echo "member reads not sent tonight"

      - name: Commit updated prices
        run: |
          git config user.name "catchem-bot"
          git config user.email "bot@catchem.app"
          mkdir -p data/raw  # eBay raw copy (#145); an empty folder adds nothing
          git add data/ppt/run-report.json data/buyout-tape.json
          # Complete write-vs-commit matrix (audited 2026-08-19): every file a
          # step writes is listed here. A file written in CI but not added
          # evaporates at job end — the class that froze the app feed and ate
          # era/catalyst history daily.
          git add config/fill-sources.json data/sealed-prices.json data/heat-report.json data/heat-history.json data/divergence-report.json data/supply-watch.json data/derived-insights.json data/era-index-history-tcg.json data/catalyst-log.json data/cohort-history.json data/alerts-state.json data/artists.json data/indexes/ data/heat-check.json data/history/tcgplayer-market/ data/catalog/tcgcsv-latest.json data/catalog/tcgcsv-coverage.json data/history/tcgcsv-daily/ data/raw/ data/search/ data/meta/ppt-usage.json data/meta/ppt-cursor.json data/history/slabs/status.json data/heartbeat.json data/derived/ research/pulse/ research/assets/the-board.html research/assets/the-pulse.html research/assets/pulse-feed.json research/assets/print-watch.html research/assets/methodology.html research/assets/corrections.html research/assets/creators.html research/assets/build.html research/assets/card-index.json research/assets/faq.html research/assets/public/reads-preview.json research/digests/news.json research/digests/weekly-news.json research/digests/feed-news.json
          if compgen -G "data/learning/grades-*.json" > /dev/null; then git add data/learning/grades-*.json; fi
          if git diff --staged --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "Update sealed prices ($(date -u +'%Y-%m-%d'))"
            # Race-hardened push (v2.1): tonight's lesson — a mid-run push to main
            # rejected our push. Rebase our one data commit onto the moved tip and
            # retry, up to 3 times, before giving up.
            for i in 1 2 3; do
              git push && break
              echo "push rejected (attempt $i) — rebasing onto moved main"
              # --autostash: an unlisted written file must never strand the
              # data commit (2026-08-22 run 32547010842: corrections.html was
              # written-but-unadded and the retry rebase refused to run)
              git pull --rebase --autostash origin main || node scripts/resolve-listing-counts-conflict.mjs || exit 1
              sleep 5
            done
          fi

      - name: Trigger app rebuild (fresh landers)
        # Landers bake feed data at build time, but Cloudflare Pages only
        # rebuilds on app-repo pushes — prices would freeze. A CF Deploy Hook
        # rebuilds the app off today's committed data. Skips cleanly until
        # Tyler stores the hook URL as repo secret CF_DEPLOY_HOOK.
        continue-on-error: true # a CF hiccup must never fail the data run
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$CF_DEPLOY_HOOK" ]; then
            echo "CF_DEPLOY_HOOK secret not set — skipping app rebuild trigger."
            exit 0
          fi
          curl -s -X POST "$CF_DEPLOY_HOOK" && echo "" && echo "App rebuild triggered."

      # THE PAGE A STRANGER GETS, not the one we just built. Runs AFTER the
      # commit and the deploy hook, because it reads the PUBLISHED URL — testing
      # it before the deploy would assert yesterday's artifact and call it
      # today's. continue-on-error because GitHub Pages publishes on its own
      # schedule and a correct fix that has not propagated yet is a slow deploy,
      # not a broken page; the fleet run is where it blocks.
      - name: Live page smoke (the published Pages URL)
        continue-on-error: true
        run: node scripts/live-page-smoke.mjs

      - name: Smoke test (live site + feed + rendered app)
        # The blank-page guard: asserts the PUBLIC pages carry real content,
        # the feed parses fresh, and the APP MOUNTS in headless Chrome with
        # zero page errors. Status codes are not proof (2026-08-22: HTTP 200,
        # blank screen). Runs after the data commit so a broken morning is
        # loud within minutes, not when Tyler opens his phone.
        run: node scripts/smoke-test.mjs

      - name: Mode honesty (figure multiset identical across modes)
        # §20's one law, machine-enforced daily against the LIVE app: every
        # mode renders every figure — order and accent only. An echo-chamber
        # mode fails the run.
        run: node scripts/mode-diff-test.mjs

      - name: PPT safety check
        # Runs after every data, publish and smoke step, so a failed private
        # push turns the run red without skipping the pulse, board, second
        # commit or app rebuild. Fails only when a push was expected and did
        # not land, or raw PPT is tracked in this public tree.
        if: always()
        run: node scripts/check-ppt-safety.mjs

      - name: Deliver the agent digest to Discord
        # Fourteen agents write research/pulse/agent-digest.md every morning and
        # nothing sent it, so the whole fleet depended on Tyler remembering to
        # open the repo. Delivery is what turns an agent's output into work
        # somebody reads. Guarded on the secret AND on the file existing;
        # continue-on-error because a Discord hiccup must never turn a good
        # morning into a red run.
        if: success()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No DISCORD_WEBHOOK_URL — skipping digest delivery."; exit 0
          fi
          if [ ! -f research/pulse/agent-digest.md ]; then
            echo "No agent-digest.md this run — nothing to deliver."; exit 0
          fi
          node -e '
            const fs = require("fs");
            // Discord caps a message at 2000 characters. Truncate on a line
            // break so the digest never ends mid-sentence, and say it was cut.
            const raw = fs.readFileSync("research/pulse/agent-digest.md", "utf-8").trim();
            const LIMIT = 1800;
            let body = raw;
            if (raw.length > LIMIT) {
              const cut = raw.slice(0, LIMIT);
              body = cut.slice(0, cut.lastIndexOf("\n")) + "\n\n…truncated — full digest in research/pulse/agent-digest.md";
            }
            fs.writeFileSync("digest-payload.json", JSON.stringify({ content: body }));
          '
          curl -s -H "Content-Type: application/json" -X POST -d @digest-payload.json "$DISCORD_WEBHOOK_URL" > /dev/null && echo "Digest delivered."

      - name: Report the failed step to Discord
        # A red run lived in the run log and an email nobody promised to read.
        # GitHub does not expose "which step failed" as an expression, so this
        # asks the API for this job's own steps and names the first failure —
        # "the run failed" costs a click and a scroll before anyone knows where
        # to look, and at 4am that click does not happen.
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No DISCORD_WEBHOOK_URL — skipping failure notice."; exit 0
          fi
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          STEP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            | node -e '
              let s = "";
              process.stdin.on("data", d => s += d).on("end", () => {
                try {
                  const jobs = JSON.parse(s).jobs || [];
                  const job = jobs.find(j => j.name === process.env.GITHUB_JOB) || jobs[0] || {};
                  const steps = job.steps || [];
                  const bad = steps.find(x => x.conclusion === "failure");
                  // Mid-run the API has often not recorded conclusions yet, which is
                  // why this printed "unknown step" on 2026-08-23 and the notice named
                  // nothing. A failure skips every later step, so the LAST step to
                  // actually complete is the one that failed.
                  const done = steps.filter(x => x.completed_at && x.conclusion !== "skipped");
                  const last = done[done.length - 1];
                  process.stdout.write(bad ? bad.name : (last ? last.name + " (inferred)" : "unknown step"));
                } catch { process.stdout.write("unknown step"); }
              });
            ')
          printf '{"content":"🔴 **Daily run failed at: %s**\\nEverything before it succeeded. %s"}' "$STEP" "$RUN" > fail-payload.json
          curl -s -H "Content-Type: application/json" -X POST -d @fail-payload.json "$DISCORD_WEBHOOK_URL" > /dev/null && echo "Failure reported: $STEP"

      - name: Mirror to the backup remote
        # One remote is not a backup. Everything — the error ledger, every
        # ruling, every session report — lives behind a single login, and the
        # most valuable part is not the code: code can be rewritten in a week,
        # the record of what broke and what we built because of it cannot.
        #
        # continue-on-error is the whole point of the design: a backup that can
        # break the thing it protects is worse than no backup. If the mirror is
        # unreachable, the daily run must still be green.
        #
        # Dormant until MIRROR_REMOTE_URL exists as a secret, so this ships now
        # and starts working the moment Tyler adds it — no second commit needed.
        # The URL carries its own credentials, so it is a secret and never a
        # committed remote.
        if: always()
        continue-on-error: true
        env:
          MIRROR_REMOTE_URL: ${{ secrets.MIRROR_REMOTE_URL }}
        run: |
          if [ -z "$MIRROR_REMOTE_URL" ]; then
            echo "No MIRROR_REMOTE_URL secret — no mirror configured yet, skipping."
            exit 0
          fi
          git remote remove mirror 2>/dev/null || true
          git remote add mirror "$MIRROR_REMOTE_URL"
          # --all so tags and every branch travel, not just today's main.
          if git push mirror --all && git push mirror --tags; then
            echo "Mirrored to the backup remote."
          else
            echo "Mirror push failed — the daily run is unaffected. Investigate the mirror, not this run."
          fi

      - name: Freshness check after the refresh (strict)
        # Stale data never blocks the refresh (warn mode in the earlier steps).
        # Last step, after every commit and publish, so a file still behind turns
        # the run red without stopping tonight's data. Same check, no warn mode.
        run: node scripts/write-health.mjs > /tmp/health-after.json

      - name: Failure summary
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Price run failed"
            echo "Failed steps:"
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
              --jq '.jobs[].steps[] | select(.conclusion=="failure") | "- " + .name' || echo "- (could not read step results)"
            echo "Price data commits happen in their own step, so check main for today's data: commit before assuming the day is lost."
          } | tee -a "$GITHUB_STEP_SUMMARY"
