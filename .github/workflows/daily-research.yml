# Weekday research digest. Runs about 6:46 AM PT (14:46 UTC, 6:46 AM PST /
# 7:46 AM PDT). The key is the repo secret XAI_API_KEY. Tyler adds it.
# A missing key fails the job and writes nothing.
name: daily-research
on:
  schedule:
    - cron: "46 14 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency:
  group: daily-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait if Update sealed prices is committing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh run list --workflow "Update sealed prices" --status in_progress --json databaseId --jq 'length' || echo 0)
            if [ "$n" = "0" ]; then
              echo "no sealed prices run in progress"
              break
            fi
            echo "sealed prices still running ($n), waiting 20s"
            sleep 20
          done
      - name: Run research script
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
        run: node scripts/daily-research.mjs
      - name: schema-guard
        run: node scripts/schema-guard.mjs
      - name: reply-line-guard
        run: node scripts/reply-line-guard.mjs
      - name: artifact-freshness
        run: node scripts/artifact-freshness.mjs
      - name: Commit and push
        run: |
          git config user.name "catchem-research-bot"
          git config user.email "bot@catchemtcg.com"
          day=$(date -u +%F)
          git add \
            "research/digests/${day}.md" \
            data/release-radar.json \
            research/assets/public/releases.json
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "research: daily digest ${day}"
          git pull --rebase origin main
          git push
