# ══════════════════════════════════════════════════════════════════
# PASTE TARGET: .github/workflows/daily-research.yml  (the file that
# currently WRONGLY holds price-pipeline content)
# ACTION: open that file → pencil ✏️ → Ctrl+A → Ctrl+V this WHOLE file
# → Commit. This RESTORES the research agent (daily digest, 13:00 UTC).
# ══════════════════════════════════════════════════════════════════
name: daily-research
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Run research agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/daily-research.mjs
      - name: Commit findings
        run: |
          git config user.name "catchem-research-bot"
          git config user.email "bot@catchemtcg.com"
          git add research/ data/release-radar.json
          git diff --cached --quiet || git commit -m "research: daily digest $(date -u +%F)"
          git push
