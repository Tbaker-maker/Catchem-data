name: Vintage listing sample

on:
  workflow_dispatch:
  schedule:
    # 07:30 UTC. The shared Browse counter frees the previous morning batch
    # around 07:18 UTC, before the 6 AM PT listing run.
    - cron: "30 7 * * *"

permissions:
  contents: write

concurrency:
  group: vintage-sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sample top WOTC listings
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/fetch-vintage-sample.mjs
      - name: Commit sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/derived/vintage-sample.json data/derived/listing-counts/state.json research/assets/public/price-hold.json research/assets/public/condition-prices.json research/assets/public/sets
          git diff --cached --quiet && exit 0
          git commit -m "data: vintage listing sample $(date -u +'%Y-%m-%dT%H:%MZ')"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 15))
          done
          exit 1
